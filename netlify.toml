[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ek/*"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/kilavuz"
  to = "/kilavuz.html"
  status = 200

[[redirects]]
  from = "/ek-:no"
  to = "/ek/ek-:no.html"
  status = 200
